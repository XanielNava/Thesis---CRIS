<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personnel Registration - CRIS PVO</title>
    <link rel="stylesheet" href="../../assets/css/pvo/pvo-signup.css">
    <link rel="icon" href="../../assets/images/cris-icon-no-background.png" type="image/x-icon">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,300;0,400;0,700;0,900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <img src="../../assets/images/cris-icon-no-background.png" alt="CRIS logo" class="logo">
            <h1>Community-Centric Rabies Information Systems</h1>
        </div>
    </header>

    <main class="main">
        <div class="registration-card">
            <a href="pvo-login.html" class="logo-link">
                <img src="../../assets/images/cris-icon-no-background.png" alt="PVO logo" class="login-logo">
            </a>

            <div class="card-header">
                <h2 class="form-title">PVO Personnel Registration</h2>
                <hr class="form-divider">
            </div>

            <form id="regForm" class="registration-form" novalidate>
                <!-- SECTION 1: PERSONNEL NAME -->
                <div class="form-section">
                    <span class="section-label">Personnel Name</span>
                    <div class="grid-4-col">
                        <div class="input-wrapper">
                            <input type="text" id="firstName" placeholder="First Name" required>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="lastName" placeholder="Last Name" required>
                        </div>
                        <input type="text" id="middleInitial" placeholder="M.I." maxlength="3">
                        <input type="text" id="suffix" placeholder="Suffix (Jr., Sr.)">
                    </div>
                </div>

                <!-- SECTION 2: ACCOUNT CREDENTIALS -->
                <div class="form-section">
                    <span class="section-label">Account Credentials</span>
                    <div class="grid-1-col">
                        <div class="input-wrapper">
                            <input type="email" id="email" placeholder="Official Email Address" required>
                        </div>
                    </div>
                    <div class="grid-2-col">
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="Password (Min 6 chars)" required>
                            <button type="button" class="toggle-password" data-target="password" aria-label="Toggle password visibility">
                                <svg class="eye-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                            </button>
                        </div>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                            <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Toggle confirm password visibility">
                                <svg class="eye-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- SECTION 3: LOCATION & CONTACT -->
                <div class="form-section">
                    <span class="section-label">Location &amp; Contact</span>
                    <div class="grid-2-col">
                        <div class="input-wrapper">
                            <input type="text" id="streetAddress" placeholder="Street / Station Address">
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="barangay" placeholder="Barangay">
                        </div>
                    </div>
                    <div class="grid-2-col">
                        <div class="input-wrapper">
                            <input type="text" id="city" placeholder="City / Municipality" required>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="province" value="Iloilo" placeholder="Province" readonly>
                        </div>
                    </div>
                    <div class="grid-2-col">
                        <div class="input-wrapper">
                            <input type="tel" id="contactNumber" placeholder="Contact Number (09XX-XXX-XXXX)" required>
                        </div>
                        <div class="input-wrapper">
                            <input type="date" id="dateOfBirth">
                        </div>
                    </div>
                </div>

                <!-- SECTION 4: DESIGNATION -->
                <div class="form-section">
                    <span class="section-label">PVO Designation Role</span>
                    <div class="grid-1-col">
                        <div class="input-wrapper">
                            <select id="designation" required>
                                <option value="">Select Official Designation Role</option>
                                <option value="Administrator">Administrator</option>
                                <option value="Veterinary Officer">Veterinary Officer</option>
                                <option value="Animal Health Technician">Animal Health Technician</option>
                                <option value="Surveillance Officer">Surveillance Officer</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- BUTTON CONTROLLER -->
                <div class="button-container">
                    <a href="pvo-login.html" class="btn btn-secondary">Back to Login</a>
                    <button type="submit" id="regButton" class="btn btn-primary">Create Account</button>
                </div>
            </form>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <!-- UI Module -->
    <script type="module" src="../../assets/js/pvo/ui/pvo-signup-ui.js"></script>
</body>
</html>
