<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access Portal</title>
    <link rel="stylesheet" href="../../assets/css/login.css">
    <link rel="icon" href="../../assets/images/cris-icon.jpg" type="image/x-icon">
    <script src="../../assets/js/menu.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="header-content">
            <img src="../../assets/images/logo-login.png" alt="CRIS logo" class="logo">
            <h1>CRIS: Community-Centric Rabies Intelligence System</h1>
            <button class="burger" onclick="openMenu()">☰ Menu</button>
        </div>
    </header>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <aside class="sidebar" id="sidebar">
        <button class="close-btn" onclick="closeMenu()">✕</button>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../src/pvo-login.html">Admin Access Portal</a>
            <a href="../src/cris-reports.html">Reports</a>
            <a href="../src/about-cris.html">About CRIS</a>
        </nav>
    </aside>

    <main class="main">
        <h2>ABTC PORTAL</h2>

        <div class="login-box">
            <a href="../../index.html" class="logo-link">
                <img src="../../assets/images/abtc-logo.png" alt="PVO logo" class="login-logo">
            </a>

            <form id="loginForm">
                <!-- Changed label and placeholder to target individual user accounts -->
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email address" required>

                <!-- 🏢 INTELLIGENT FACILITY BADGE REVEAL INDICATOR -->
                <div id="facilityIndicator" style="display: none; width: 100%; margin-bottom: 15px; padding: 10px; background-color: #f0f7ff; border-left: 4px solid #1a73e8; border-radius: 4px; box-sizing: border-box;">
                    <span style="font-size: 12px; color: #666; display: block; font-weight: bold; text-transform: uppercase; letter-spacing: 0.5px;">Authorized Workplace</span>
                    <span id="facilityNameText" style="font-size: 14px; color: #111; font-weight: 700;">Loading Facility Details...</span>
                </div>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
                
                <div class="button-container">
                    <button type="button" id="backBtn" onclick="window.location.href='../../index.html'">Back</button>
                    <button type="submit" id="loginBtn">Login</button>
                </div>

                <div class="auth-links" style="display: flex; justify-content: space-between; margin-top: 15px; font-size: 13px;">
                    <a href="#" class="forgot" style="text-decoration: none; color: #666;">Forgot Password?</a>
                    <a href="abtc-setup.html" class="setup-system" style="text-decoration: none; color: var(--sunset-orange, #EA6113); font-weight: bold;">⚙ Setup New Facility</a>
                </div>
            </form>
        </div>

        <script type="module" src="../../assets/js/abtc-login.js"></script>
    </main>

    <footer class="footer"></footer>
</body>
</html>
