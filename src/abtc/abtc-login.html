<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access Portal — CRIS</title>
    <link rel="stylesheet" href="../../assets/css/main/login.css">
    <link rel="icon" href="../../assets/images/cris-icon.jpg" type="image/x-icon">
    <script src="../../assets/js/main/menu.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <!-- HEADER -->
    <header class="header">
        <div class="header-content">
            <img src="../../assets/images/logo-login.png" alt="CRIS logo" class="logo">
            <h1>CRIS: Community-Centric Rabies Intelligence System</h1>
            <button class="burger" onclick="openMenu()">☰ Menu</button>
        </div>
    </header>

    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- SIDEBAR NAV -->
    <aside class="sidebar" id="sidebar">
        <button class="close-btn" onclick="closeMenu()">✕</button>
        <nav>
            <a href="../../index.html">Home</a>
            <a href="abtc-login.html" class="active">Admin Access Portal</a>
            <a href="cris-reports.html">Reports</a>
            <a href="about-cris.html">About CRIS</a>
        </nav>
    </aside>

    <!-- MAIN PORTAL AREA -->
    <main class="main">
        <h2>ABTC PORTAL</h2>

        <div class="login-box">
            <a href="../../index.html" class="logo-link">
                <img src="../../assets/images/abtc-logo.png" alt="ABTC logo" class="login-logo">
            </a>

            <form id="loginForm">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email address" required>

                <!-- 🏢 INTELLIGENT WORKPLACE INDICATOR (SLIDES DOWN VIA CSS) -->
                <div id="facilityIndicator" class="form-group-dynamic">
                    <div style="padding: 10px 12px; margin-bottom: 15px; background-color: #ffffff; border-left: 4px solid var(--sunset-orange); border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.05);">
                        <span style="font-size: 11px; color: #888; display: block; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">Authorized Facility</span>
                        <span id="facilityNameText" style="font-size: 13.5px; color: var(--text-dark); font-weight: 800;">Loading Facility Details...</span>
                    </div>
                </div>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
                
                <div class="button-container">
                    <button type="button" id="backBtn" onclick="window.location.href='../../index.html'">Back</button>
                    <button type="submit" id="loginBtn">Login</button>
                </div>

                <div class="auth-links">
                    <a href="#" class="forgot">Forgot Password?</a>
                    <a href="abtc-setup.html" class="setup-system" style="color: var(--sunset-orange); font-weight: 700;">⚙ Setup New Facility</a>
                </div>
            </form>
        </div>
    </main>

    <footer class="footer"></footer>

    <script type="module" src="../../assets/js/abtc/abtc-login.js"></script>
</body>
</html>
