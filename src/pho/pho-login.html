<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Access Portal</title>
    <link rel="stylesheet" href="../../assets/css/main/login.css">
    <link rel="icon" href="../../assets/images/cris-icon.png?v=2" type="image/png">
    <script src="../../assets/js/main/menu.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <img src="../../assets/images/logo-login.png" alt="CRIS logo" class="logo">
            <h1>CRIS: Community-Centric Rabies Intelligence System</h1>
            <button type="button" class="burger" onclick="openMenu()">☰ Menu</button>
        </div>
    </header>
    
    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <button type="button" class="close-btn" onclick="closeMenu()">✕</button>
        <nav>
            <a href="../../index.html">Home</a>
            <a href="pho-login.html">Admin Access Portal</a>
            <a href="../../src/cris-reports.html">Reports</a>
            <a href="../../src/about-cris.html">About CRIS</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="main">
        <h2>PHO ADMIN ACCESS PORTAL</h2>

        <div class="login-box">
            <a href="../../index.html" class="logo-link">
                <img src="../../assets/images/pho-logo.png" alt="PHO logo" class="login-logo">
            </a>

            <form id="loginForm">
                <!-- STEP 1: CHOOSE DESIGNATION FIRST -->
                <label for="designation">Designation</label>
                <select id="designation" name="designation" required>
                    <option value="">Select Designation</option>
                    <option value="Administrator">Administrator</option>
                    <option value="Facilitating Nurse">Facilitating Nurse</option>
                    <option value="Health Officer">Health Officer</option>
                </select>

                <!-- STEP 2: EMAIL & PASSWORD (HIDDEN UNTIL DESIGNATION IS CHOSEN) -->
                <div id="credentialsContainer" class="credentials-reveal" hidden>
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Enter Email" disabled required>

                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="password" placeholder="Enter Password" disabled required>
                        <button type="button" class="toggle-password" data-target="password" aria-label="Toggle password visibility">
                            <svg class="eye-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                        </button>
                    </div>
                </div>

                <div class="button-container">
                    <a href="../../index.html" class="btn btn-secondary">Back</a>
                    <button type="submit" id="loginBtn" class="btn btn-primary" hidden>Login</button>
                </div>

                <div class="auth-links">
                    <a href="pho-signup.html" class="signup">Create Account</a>
                    <a href="#" class="forgot">Forgot Password?</a>
                </div>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer class="footer"></footer>

    <script type="module" src="../../assets/js/pho/ui/pho-login.js"></script>
</body>
</html>
