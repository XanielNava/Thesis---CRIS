<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login | CRIS ABTC</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- Core Theme Styles -->
<link rel="stylesheet" href="admin-module.css">
<!-- Login Specific Styles -->
<link rel="stylesheet" href="admin-login.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">
    
    <div class="login-header">
      <img src="assets/images/cris-icon-no-background.png" alt="CRIS Logo" class="login-logo">
      <h2>Welcome Back</h2>
      <p>Sign in to the ABTC Module Manager</p>
    </div>

    <!-- For testing, this form redirects straight to the dashboard -->
    <form class="login-form" action="abtc-dashboard.html">
      
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="email" placeholder="admin@cris-abtc.gov.ph" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-with-icon">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="password" placeholder="••••••••" required>
        </div>
      </div>

      <div class="login-options">
        <label class="remember-me">
          <input type="checkbox"> Remember me
        </label>
        <a href="#" class="forgot-password">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary login-btn">Sign In</button>
    
    </form>
  </div>
</div>

</body>
</html>
