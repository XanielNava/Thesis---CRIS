<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Settings | CRIS ABTC</title>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<!-- FontAwesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="admin-module.css">
</head>
<body>
<div class="app-shell">
  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar__brand">
      <img src="assets/images/cris-icon-no-background.png" alt="CRIS Logo" class="sidebar__logo-img">
      <h2>CRIS</h2>
      <small>ABTC Manager</small>
    </div>
    <div class="sidebar__nav">
      <span class="sidebar__label">Manage</span>
      <a href="admin-dashboard.html" class="sidebar__link"><i class="fa-solid fa-chart-pie"></i> Dashboard</a>
      <a href="admin-facility-registry.html" class="sidebar__link"><i class="fa-solid fa-hospital"></i> Facility Registry</a>
      <a href="admin-reports.html" class="sidebar__link"><i class="fa-solid fa-triangle-exclamation"></i> Reports & Complaints <span class="sidebar__badge">3</span></a>
      <span class="sidebar__label">Account</span>
      <a href="admin-settings.html" class="sidebar__link sidebar__link--active"><i class="fa-solid fa-gear"></i> Settings</a>
      <a href="admin-login.html" class="sidebar__link"><i class="fa-solid fa-right-from-bracket"></i> Log Out</a>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main">
    <header class="topbar">
      <div class="topbar__title">
        <h1>Settings</h1>
        <p>System configurations and module defaults</p>
      </div>
      <div class="topbar__actions">
        <div class="user-profile">
          <div class="user-avatar">AM</div>
          <div class="user-info"><strong>ABTC Admin</strong></div>
        </div>
      </div>
    </header>

    <main class="content">
      <div class="settings-grid">
        
        <!-- Setting Card 1 -->
        <div class="panel setting-card">
          <h3>System Defaults</h3>
          <div class="form-group">
            <label>Region Coverage</label>
            <input type="text" value="Western Visayas">
          </div>
          <div class="form-group">
            <label>Admin Name</label>
            <input type="text" value="ABTC Administrator">
          </div>
          <div class="form-group">
            <label>Contact Email</label>
            <input type="email" value="admin@cris-abtc.gov.ph">
          </div>
          <button class="btn btn-primary" style="margin-top: 8px;">Save Settings</button>
        </div>
        
        <!-- Setting Card 2 -->
        <div class="panel setting-card">
          <h3>Security & Backup</h3>
          <div class="form-group">
            <label>Last System Backup</label>
            <input type="text" value="August 8, 2026 - 02:00 AM" disabled style="background: #f8fafc; color: var(--text-muted); cursor: not-allowed;">
          </div>
          <div class="form-group">
            <label>Auto-Backup Frequency</label>
            <select style="width: 100%; padding: 10px 12px; border: 1px solid var(--border-light); border-radius: var(--radius-sm); font-size: 13px; outline: none;">
              <option>Daily</option>
              <option selected>Weekly</option>
              <option>Monthly</option>
            </select>
          </div>
          <button class="btn btn-primary" style="margin-top: 8px; background: var(--sidebar-bg); box-shadow: none;">Manual Backup</button>
        </div>

        <!-- Setting Card 3 -->
        <div class="panel setting-card">
          <h3>Module Rules</h3>
          <div style="display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px;">
            <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; cursor: pointer;">
              <input type="checkbox" checked style="width: 16px; height: 16px; accent-color: var(--sunset-orange);"> Allow anonymous reports
            </label>
            <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; cursor: pointer;">
              <input type="checkbox" checked style="width: 16px; height: 16px; accent-color: var(--sunset-orange);"> Auto-notify facilities on status change
            </label>
            <label style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; cursor: pointer;">
              <input type="checkbox" style="width: 16px; height: 16px; accent-color: var(--sunset-orange);"> Require manual approval for new facilities
            </label>
          </div>
          <button class="btn btn-primary" style="background: var(--sidebar-bg); box-shadow: none;">Update Rules</button>
        </div>

      </div>
    </main>
  </div>
</div>
</body>
</html>
