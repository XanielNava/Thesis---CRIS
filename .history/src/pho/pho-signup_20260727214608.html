<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personnel Registration - CRIS</title>
    
    <!-- Stylesheets & Fonts -->
    <link rel="stylesheet" href="../../assets/css/pho-signup.css">
    <link rel="icon" href="../assets/images/cris-icon.jpg" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">

    <!-- Menu Control Script -->
    <script src="../../assets/js/menu.js"></script>
</head>

<body>

        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.10.0/firebase-analytics.js";

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <img src="../../assets/images/cris-icon-no-background.png" alt="CRIS logo" class="logo">
            <h1></h1>
            <button class="burger" onclick="openMenu()">☰ Menu</button>
        </div>
    </header>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <button class="close-btn" onclick="closeMenu()">✕</button>
        <nav>
            <a href="/index.html">Home</a>
            <a href="../../src/pho/pho-login.html">Admin Access Portal</a>
            <a href="../src/cris-reports.html">Reports</a>
            <a href="../src/about-cris.html">About CRIS</a>
        </nav>
    </aside>

    <!-- Main Form Container -->
    <main class="main">
        <div class="registration-card">
            
            <!-- Top Banner Logo -->
            <div class="card-header">
                <a href="../../index.html" class="logo-link">
                    <img src="../../assets/images/pho-logo.png" alt="PHO logo" class="login-logo">
                </a>
                <h2 class="form-title">Personnel Registration Form</h2>
                <hr class="form-divider">
            </div>

            <!-- Form Content Body -->
            <form id="regForm" class="registration-form">
                
                <!-- Section 1: Personnel Name -->
                <div class="form-section">
                    <label class="section-label">Personnel Name</label>
                    <div class="grid-4-col">
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                            <input type="text" id="firstName" placeholder="First Name" required>
                        </div>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                            <input type="text" id="lastName" placeholder="Last Name" required>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="middleInitial" placeholder="M.I." required>
                        </div>
                        <div class="input-wrapper">
                            <input type="text" id="suffix" placeholder="Suffix (Jr./Sr.)">
                        </div>
                    </div>
                </div>

                <!-- Section 2: Account Credentials -->
                <div class="form-section">
                    <label class="section-label">Account Credentials</label>
                    <div class="grid-1-col">
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-5V6l8 5 8-5v2z"/></svg>
                            <input type="email" id="email" placeholder="Email Address" required>
                        </div>
                    </div>
                    <div class="grid-2-col">
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                            <input type="password" id="password" placeholder="Password" required>
                        </div>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                        </div>
                    </div>
                </div>

                <!-- Section 3: Address & Contact Details -->
                <div class="form-section">
                    <label class="section-label">Contact & Location</label>
                    <div class="grid-1-col">
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
                            <input type="text" id="address" placeholder="Complete Address (Street, Barangay, City/Municipality)">
                        </div>
                    </div>
                    <div class="grid-2-col">
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>
                            <input type="tel" id="contactNumber" placeholder="Contact Number">
                        </div>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24"><path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.11 0-1.99.9-1.99 2L3 19c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V8h14v11z"/></svg>
                            <input type="date" id="dateOfBirth">
                        </div>
                    </div>
                </div>

                <!-- Section 4: Role Assignment -->
                <div class="form-section">
                    <label class="section-label">Designation</label>
                    <div class="grid-1-col">
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 6h-4V4c0-1.11-.89-2-2-2h-4c-1.11 0-2 .89-2 2v2H4c-1.11 0-1.99.89-1.99 2L2 19c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V8c0-1.11-.89-2-2-2zm-6 0h-4V4h4v2z"/></svg>
                            <select id="designation" required>
                                <option value="" disabled selected>Select Designation Role</option>
                                <option value="Administrator">Administrator</option>
                                <option value="Nurse">Nurse</option>
                                <option value="Health Officer">Health Officer</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Action Buttons -->
                <div class="button-container">
                    <a href="pho-login.html" class="btn btn-secondary">Back</a>
                    <button type="submit" id="regButton" class="btn btn-primary">Sign Up</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
