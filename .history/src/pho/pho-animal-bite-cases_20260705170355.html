<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHO - Animal Bite Cases</title>

    <link rel="stylesheet" href="../../assets/css/pvo-animal-bite-cases.css">
    <link rel="icon" href="../../assets/images/cris-icon-no-background.png" type="image/x-icon">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>
    <div class="app-container">
        <!-- UNIVERSAL SIDEBAR -->
        <aside class="sidebar">
            <div class="logo-section">
                <img src="../../assets/images/logo-login.png" alt="CRIS Logo" class="logo-image">
                <p>Community-Centric<br>Rabies Intelligence System</p>
                <div class="role-badge">PHO MODULE</div>
            </div>

            <nav class="menu">
                <a href="pho-dash.html" class="menu-item">Dashboard</a>
                <a href="pho-animal-bite-cases.html" class="menu-item active">Animal Bite Cases</a>
                <a href="pho-heat-map.html" class="menu-item">Heatmap</a>
                <!-- <a href="#" class="menu-item">Statistics</a>
                <a href="#" class="menu-item">Messages</a>
                <a href="#" class="menu-item">Inventory</a>
                <a href="#" class="menu-item">Reports</a> -->
            </nav>

            <div class="footer-nav">
                <a href="#" class="menu-item alt">Settings</a>
                <button id="logout-btn" class="menu-item alt logout"
                    onclick="window.location.href='pho-login.html'">Logout</button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">
            <header class="header">
                <h1>ANIMAL BITE CASES</h1>
                <div class="user-profile-top">
                    <div class="profile-info">
                        <strong>Xaniel Marios Angelo B. Nava</strong><br>
                        <span>Administrator</span>
                    </div>
                    <div class="profile-icon"></div>
                </div>
            </header>

            <section class="card">
                <div class="topbar">
                    <div class="search-section">
                        <div class="search-input">
                            <i class="fa-solid fa-magnifying-glass"></i>
                            <input 
                            type="text" 
                            id="caseSearch" placeholder="Search municipality or ABTC...">

</div>
                    </div>

                    <div class="export-buttons">
                        <button id="csvBtn" class="btn-export">
                            <i class="fa-solid fa-file-csv"></i>CSV
                        </button>

                        <button id="excelBtn" class="btn-export">
                            <i class="fa-solid fa-file-excel"></i>Excel
                        </button>

                        <button id="pdfBtn" class="btn-export">
                            <i class="fa-solid fa-file-pdf"></i>PDF
                        </button>

                        <button id="printBtn" class="btn-export">
                            <i class="fa-solid fa-print"></i>
                            Print
                        </button>
                    </div>
                </div>

                <div class="table-container">
                    <table id="casesTable">
                        <thead>
                            <tr>
                                <th>ABTC</th>
                                <th>Male</th>
                                <th>Female</th>
                                <th>Age</th>
                                <th>Category 1</th>
                                <th>Category 2</th>
                                <th>Category 3</th>
                            </tr>
                        </thead>
                        <tbody id="casesTableBody">
                            <!-- Dynamic Content -->
                        </tbody>
                    </table>
                </div>

                <nav class="pagination">
                    <button class="active">1</button>
                    <button>2</button>
                    <button>Next</button>
                </nav>
            </section>
        </main>
    </div>

    <script type="module" src="../assets/js/abc.js"></script>

</body>

</html>
