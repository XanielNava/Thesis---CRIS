</head>
<body>

    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <img src="../assets/images/logo-login.png" alt="CRIS logo" class="logo">
            <h1>Personnel Registration</h1>
            <button class="burger" onclick="openMenu()">☰ Menu</button>
        </div>
    </header>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <button class="close-btn" onclick="closeMenu()">✕</button>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../src/pvo-login.html">Admin Access Portal</a>
            <a href="../src/cris-reports.html">Reports</a>
            <a href="../src/about-cris.html">About CRIS</a>
        </nav>
    </aside> 

    <!-- Main Registration Container -->
    <main class="main">
        <div class="registration-card">
            <a href="../index.html" class="logo-link">
                <img src="../assets/images/lgu-logo.png" alt="CRIS LGU Logo" class="login-logo">
            </a>

            <div class="card-header">
                <h2 class="form-title">LGU Personnel Registration</h2>
                <hr class="form-divider">
            </div>

            <form id="regForm">
                <!-- Name Fields -->
                <div class="form-row grid-2">
                    <div>
                        <label for="firstName">First Name *</label>
                        <input type="text" id="firstName" placeholder="First Name" required>
                    </div>
                    <div>
                        <label for="lastName">Last Name *</label>
                        <input type="text" id="lastName" placeholder="Last Name" required>
                    </div>
                </div>

                <div class="form-row grid-2">
                    <div>
                        <label for="middleInitial">Middle Initial</label>
                        <input type="text" id="middleInitial" placeholder="M.I.">
                    </div>
                    <div>
                        <label for="suffix">Suffix</label>
                        <input type="text" id="suffix" placeholder="Jr. / Sr. / III">
                    </div>
                </div>

                <!-- LGU Jurisdiction: Cascading Dropdowns -->
                <div class="form-row grid-2">
                    <div>
                        <label for="district">District *</label>
                        <select id="district" required onchange="updateMunicipalities()">
                            <option value="">Select District</option>
                            <option value="1st District">1st District</option>
                            <option value="2nd District">2nd District</option>
                            <option value="3rd District">3rd District</option>
                            <option value="4th District">4th District</option>
                            <option value="5th District">5th District</option>
                            <option value="Highly Urbanized City">Highly Urbanized City</option>
                        </select>
                    </div>
                    <div>
                        <label for="municipality">Municipality / LGU *</label>
                        <select id="municipality" required disabled>
                            <option value="">Select District First</option>
                        </select>
                    </div>
                </div>

                <!-- Role Assignment -->
                <div class="form-group">
                    <label for="designation">Designation *</label>
                    <select id="designation" required>
                        <option value="">Select Designation</option>
                        <option value="Administrator">Administrator</option>
                        <option value="Veterinary Officer">Veterinary Officer</option>
                        <option value="Health Officer">Health Officer</option>  
                        <option value="Data Encoder">Data Encoder</option>
                    </select>
                </div>

                <!-- Account Credentials -->
                <div class="form-group">
                    <label for="email">Official Email *</label>
                    <input type="email" id="email" placeholder="name@lgu.gov.ph" required>
                </div>

                <!-- Password Credentials with Matching Eye Toggle -->
                <div class="form-row grid-2">
                    <div>
                        <label for="password">Password *</label>
                        <div class="input-wrapper">
                            <input type="password" id="password" placeholder="Password" required>
                            <button type="button" class="toggle-password" onclick="toggleVisibility('password', this)" aria-label="Toggle password visibility">
                                <svg class="eye-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                            </button>
                        </div>
                    </div>
                    <div>
                        <label for="confirmPassword">Confirm Password *</label>
                        <div class="input-wrapper">
                            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                            <button type="button" class="toggle-password" onclick="toggleVisibility('confirmPassword', this)" aria-label="Toggle password visibility">
                                <svg class="eye-icon" viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Personal Information Details -->
                <div class="form-row grid-2">
                    <div>
                        <label for="contactNumber">Contact Number</label>
                        <input type="text" id="contactNumber" placeholder="09XXXXXXXXX">
                    </div>
                    <div>
                        <label for="dateOfBirth">Date of Birth</label>
                        <input type="date" id="dateOfBirth">
                    </div>
                </div>

                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="Barangay, Municipality, Province">
                </div>

                <!-- Submission Controls -->
                <div class="button-container">
                    <button id="backButton" type="button" class="btn btn-secondary" onclick="window.location.href='../src/lgu-login.html'">Back</button>
                    <button id="regButton" type="submit" class="btn btn-primary">Sign Up</button>
                </div>
            </form>

            <script type="module" src="../assets/js/cris-signup-pvo.js"></script>
        </div>
    </main>

    <!-- Page Scripts -->
    <script>
        // Data mapping for Iloilo Province Districts & Municipalities
        const districtData = {
            "1st District": ["Guimbal", "Igbaras", "Miagao", "Oton", "San Joaquin", "Tigbauan", "Tubungan"],
            "2nd District": ["Alimodian", "Leganes", "Leon", "New Lucena", "Pavia", "San Miguel", "Santa Barbara", "Zarraga"],
            "3rd District": ["Badiangan", "Bingawan", "Cabatuan", "Calinog", "Janiuay", "Lambunao", "Maasin", "Mina", "Pototan"],
            "4th District": ["Anilao", "Banate", "Barotac Nuevo", "Dingle", "Dueñas", "Dumangas", "Passi City", "San Enrique"],
            "5th District": ["Ajuy", "Balasan", "Barotac Viejo", "Batad", "Carles", "Concepcion", "Estancia", "Lemery", "San Dionisio", "San Rafael", "Sara"],
            "Highly Urbanized City": ["Iloilo City"]
        };

        // Cascading Dropdown Handler
        function updateMunicipalities() {
            const districtSelect = document.getElementById("district");
            const muniSelect = document.getElementById("municipality");
            const selectedDistrict = districtSelect.value;

            muniSelect.innerHTML = ""; // Reset dropdown

            if (selectedDistrict && districtData[selectedDistrict]) {
                muniSelect.disabled = false;
                
                let defaultOpt = document.createElement("option");
                defaultOpt.value = "";
                defaultOpt.textContent = "Select Municipality";
                muniSelect.appendChild(defaultOpt);

                districtData[selectedDistrict].forEach(muni => {
                    let opt = document.createElement("option");
                    opt.value = muni;
                    opt.textContent = muni;
                    muniSelect.appendChild(opt);
                });
            } else {
                muniSelect.disabled = true;
                let defaultOpt = document.createElement("option");
                defaultOpt.value = "";
                defaultOpt.textContent = "Select District First";
                muniSelect.appendChild(defaultOpt);
            }
        }

        // Matching Password Visibility Toggle Script
        function toggleVisibility(inputId, btn) {
            const input = document.getElementById(inputId);
            const icon = btn.querySelector('.eye-icon');

            if (input.type === 'password') {
                input.type = 'text';
                // Slashed Eye SVG when visible
                icon.innerHTML = `<path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z"/>`;
            } else {
                input.type = 'password';
                // Regular Eye SVG when hidden
                icon.innerHTML = `<path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>`;
            }
        }
    </script>
</body>
</html>
