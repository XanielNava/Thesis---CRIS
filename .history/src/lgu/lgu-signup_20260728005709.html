    <!-- Header -->
    <header class="header">
        <div class="header-content">
            <img src="../assets/images/logo-login.png" alt="CRIS logo" class="logo">
            <h1>Personnel Registration</h1>
            <button class="burger" onclick="openMenu()">☰ Menu</button>
        </div>
    </header>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="closeMenu()"></div>

    <!-- Sidebar Navigation -->
    <aside class="sidebar" id="sidebar">
        <button class="close-btn" onclick="closeMenu()">✕</button>
        <nav>
            <a href="../index.html">Home</a>
            <a href="../src/pvo-login.html">Admin Access Portal</a>
            <a href="../src/cris-reports.html">Reports</a>
            <a href="../src/about-cris.html">About CRIS</a>
        </nav>
    </aside> 

    <!-- Main Registration Section -->
    <main class="main">
        <div class="login-box">
            <a href="../index.html" class="logo-link">
                <img src="../assets/images/lgu-logo.png" alt="CRIS LGU Module Logo" class="login-logo">
            </a>

            <div class="registration-header">
                <h2>LGU Personnel Account Request</h2>
                <p>Register your official local government credentials for CRIS module access.</p>
            </div>

            <div class="container">
                <form id="regForm">
                    
                    <!-- SECTION 1: PERSONAL INFORMATION -->
                    <fieldset class="form-section">
                        <legend>Personal Details</legend>
                        <div class="input-group grid-2">
                            <input type="text" id="firstName" placeholder="First Name" required>
                            <input type="text" id="lastName" placeholder="Last Name" required>
                        </div>
                        <div class="input-group grid-2">
                            <input type="text" id="middleInitial" placeholder="M.I.">
                            <input type="text" id="suffix" placeholder="Suffix (e.g. Jr., III)">
                        </div>
                        <div class="input-group grid-2">
                            <input type="date" id="dateOfBirth" placeholder="Date of Birth" required>
                            <input type="text" id="contactNumber" placeholder="Contact Number (09XXXXXXXXX)" required>
                        </div>
                    </fieldset>

                    <!-- SECTION 2: LGU & JURISDICTION ASSIGNMENT -->
                    <fieldset class="form-section">
                        <legend>LGU Jurisdiction & Office</legend>
                        
                        <!-- Municipality Selection (Identifies which LGU they belong to) -->
                        <div class="input-group">
                            <select id="lguMunicipality" required>
                                <option value="">Select Municipality / City</option>
                                <option value="Pavia">Pavia</option>
                                <option value="Santa Barbara">Santa Barbara</option>
                                <option value="Oton">Oton</option>
                                <option value="Pototan">Pototan</option>
                                <option value="Cabatuan">Cabatuan</option>
                                <!-- Expand with other Iloilo LGUs -->
                            </select>
                        </div>

                        <!-- Department / Office -->
                        <div class="input-group">
                            <select id="officeDepartment" required>
                                <option value="">Select Office / Department</option>
                                <option value="Municipal Agriculture Office (MAO)">Municipal Agriculture Office (MAO)</option>
                                <option value="Municipal Health Office (MHO) / RHU">Municipal Health Office (MHO) / RHU</option>
                                <option value="Veterinary Services Division">Veterinary Services Division</option>
                                <option value="Barangay Health Center">Barangay Health Center</option>
                            </select>
                        </div>

                        <!-- Official Role & ID Verification -->
                        <div class="input-group grid-2">
                            <select id="designation" required>
                                <option value="">Select Designation / Role</option>
                                <option value="Veterinary Officer">Veterinary Officer</option>
                                <option value="Livestock Inspector">Livestock Inspector</option>
                                <option value="Rural Health Nurse / Officer">Rural Health Nurse / Officer</option>
                                <option value="BHW Coordinator">BHW Coordinator</option>
                                <option value="Data Encoder">Data Encoder</option>
                            </select>
                            
                            <input type="text" id="employeeId" placeholder="Employee / Government ID No." required>
                        </div>
                    </fieldset>

                    <!-- SECTION 3: LOGIN CREDENTIALS -->
                    <fieldset class="form-section">
                        <legend>Account Credentials</legend>
                        <div class="input-group">
                            <input type="email" id="email" placeholder="Official / Government Email" required>
                        </div>
                        <div class="input-group grid-2">
                            <input type="password" id="password" placeholder="Password" required>
                            <input type="password" id="confirmPassword" placeholder="Confirm Password" required>
                        </div>
                    </fieldset>

                    <!-- SUBMIT / NAVIGATION BUTTONS -->
                    <div class="button-container">
                        <button id="backButton" type="button" onclick="window.location.href='../src/lgu-login.html'">Back to Login</button>
                        <button id="regButton" type="submit">Submit Request</button>
                    </div>
                </form>

                <script type="module" src="../assets/js/cris-signup-pvo.js"></script>
            </div>
        </div>
    </main>     
</body>
</html>
