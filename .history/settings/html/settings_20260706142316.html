<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHO - Heatmaps</title>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="../../settings/css/settings.css">
    
    <link rel="icon" href="../../assets/images/cris-icon-no-background.png" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>

<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="logo-section">
                <img src="../../assets/images/logo-login.png" alt="CRIS Logo" class="logo-image">
                <p>Community-Centric<br>Rabies Intelligence System</p>
                <div class="role-badge">PHO MODULE</div>
            </div>

            <nav class="menu">
                <a href="pho-dash.html" class="menu-item">Dashboard</a>
                <a href="pho-animal-bite-cases.html" class="menu-item">Animal Bite Cases</a>
                <a href="pho-heat-map.html" class="menu-item active">Heatmap</a>
            </nav>
        </aside>
    </div>

    <div class="settings-container">
        <aside class="settings-sidebar">
            <div class="settings-header">
                <h2>Settings</h2>
                <button id="close-settings" class="close-btn"><i class="fas fa-times"></i></button>
            </div>

            <div class="settings-content">
                <div class="settings-section">
                    <h3>Theme</h3>
                    <label for="theme-select">Select Theme:</label>
                    <select id="theme-select">
                        <option value="light">Light</option>
                        <option value="dark">Dark</option>
                    </select>
                </div>

                <div class="settings-section">
                    <h3>Notifications</h3>
                    <label for="notifications-toggle">Enable Notifications:</label>
                    <input type="checkbox" id="notifications-toggle">
                </div>

                <div class="settings-section">
                    <h3>Account</h3>
                    <button id="change-password-btn">Change Password</button>
                </div>
            </div>
        </aside>
    </div>


</body>

</html>
